<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Draw Steel - 목차</title>
    <!-- 이 파일은 사이트 루트(manifest 의 path 기준 폴더)에 둡니다. 다른 폴더에 두면 아래 두 경로의 앞부분만 고치세요 -->
    <link rel="stylesheet" href="../assets/css/common_book.css">
    <style>
        /* ---------- 목차 전용 스타일 (색·글꼴은 common-book.css 의 변수를 사용) ---------- */
        .toc-back {
            display: inline-block;
            margin: 0 0 1rem;
            color: var(--neutral-600);
            font-family: var(--font-ui), sans-serif;
            font-size: calc(.95rem * var(--scale));
            text-decoration: none;
        }
        .toc-back:hover { color: var(--accent); text-decoration: underline; }

        .toc-lead {
            max-width: 38rem;
            margin: 0 0 1.4rem;
            color: var(--neutral-600);
        }

        /* 좌우 2단: 왼쪽 = 시작 규칙, 오른쪽 = 데이터 */
        .toc-cols {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            align-items: start;
        }
        .toc-cols > section:first-child { padding-right: 1.2rem; }
        .toc-cols > section + section {               /* 두 단 사이 세로 구분선 */
            padding-left: 1.2rem;
            border-left: 1px solid var(--neutral-300);
        }
        .toc-cols.is-single { grid-template-columns: minmax(0, 1fr); }
        .toc-cols.is-single > section { padding: 0; border-left: 0; }
        .toc-cols h2 { margin: 0 0 .6rem; }

        .toc-list {
            margin: 0;
            padding: 0;
            list-style: none;
            border-top: 2px solid var(--neutral-800);
        }
        .toc-list .toc-list,
        .toc-cols .toc-list { border-top: 0; }        /* 단 제목(h2)의 밑줄이 이미 구분선 역할 */

        /* 문서 한 줄 (링크) 과 묶음 버튼은 같은 모양 */
        .toc-link,
        .toc-group-btn {
            box-sizing: border-box;                   /* width:100% 에 여백이 더해져 칸 밖으로 넘치지 않도록 */
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .8rem;
            width: 100%;
            margin: 0;
            padding: .8rem .8rem .8rem .7rem;
            border: 0;
            border-bottom: 1px solid var(--neutral-300);
            background: none;
            color: var(--neutral-800);
            font-family: var(--font-head), sans-serif;
            font-size: calc(1.35rem * var(--scale));
            font-weight: 800;
            line-height: 1.15;
            text-align: left;
            text-decoration: none;
            cursor: pointer;
            transition: background .15s, box-shadow .15s, color .15s;
        }
        .toc-link:hover,
        .toc-group-btn:hover,
        .toc-group.is-open > .toc-group-btn {
            background: rgba(var(--highlight-rgb), .1);
            box-shadow: inset 4px 0 0 var(--accent);
        }
        .toc-link:hover,
        .toc-group-btn:hover { color: var(--accent); }
        .toc-link:focus-visible,
        .toc-group-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: -2px;
        }

        /* 묶음 버튼의 화살표 (펼치면 아래로 돌아감) */
        .toc-caret {
            flex: none;
            width: .55rem;
            height: .55rem;
            border-right: 2px solid currentColor;
            border-bottom: 2px solid currentColor;
            transform: rotate(-45deg);
            transition: transform .2s;
        }
        .toc-group.is-open > .toc-group-btn .toc-caret { transform: rotate(45deg); }

        /* 펼침 영역: 높이를 0 → 내용 높이로 부드럽게 */
        .toc-panel {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows .22s ease;
        }
        .toc-group.is-open > .toc-panel { grid-template-rows: 1fr; }
        .toc-panel > .toc-list {
            min-height: 0;
            overflow: hidden;
            visibility: hidden;                       /* 접힌 동안은 키보드 포커스도 막음 */
            transition: visibility 0s .22s;
            margin-left: 1rem;
            border-left: 2px solid var(--neutral-300);
        }
        .toc-group.is-open > .toc-panel > .toc-list {
            visibility: visible;
            transition-delay: 0s;
        }
        .toc-panel .toc-link,
        .toc-panel .toc-group-btn {
            font-size: calc(1.1rem * var(--scale));
            font-weight: 700;
            padding-top: .6rem;
            padding-bottom: .6rem;
        }

        /* 비어 있거나 불러오지 못했을 때 */
        .toc-message {
            padding: 1.2rem 1rem;
            border-left: 4px solid var(--accent);
            background: rgba(var(--ink-rgb), .06);
        }
        .toc-message strong { display: block; margin-bottom: .2rem; }
        .toc-message code {
            font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: .9em;
        }

        @media (max-width: 45rem) {
            .toc-cols { grid-template-columns: minmax(0, 1fr); row-gap: 2rem; }
            .toc-cols > section { padding: 0 !important; border-left: 0 !important; }
        }
        @media (prefers-reduced-motion: reduce) {
            .toc-link, .toc-group-btn, .toc-caret, .toc-panel, .toc-panel > .toc-list { transition: none; }
        }
    </style>
</head>
<body>
<div class="book">
    <section class="page">
        <header>
            <a class="toc-back" id="toc-back" href="../index.html">← RPG 시스템</a>
            <h1>Draw Steel</h1>
        </header>

        <div class="toc-cols" id="toc-cols">
            <section id="toc-left" aria-labelledby="toc-left-title">
                <h2 id="toc-left-title">규칙</h2>
                <ul class="toc-list" id="toc-left-list"></ul>
            </section>
            <section id="toc-right" aria-labelledby="toc-right-title">
                <h2 id="toc-right-title">데이터</h2>
                <ul class="toc-list" id="toc-right-list"></ul>
            </section>
        </div>
    </section>
</div>

<!-- 목차 데이터: 문서 목록(title, path, children, column)은 manifest.js 에서 가져옵니다 -->
<script src="../assets/js/manifest.js"></script>
<script>
    (function () {
        const colsEl = document.getElementById("toc-cols");

        // ----------------------------------------------------
        // pager.js 와 같은 경로 규칙
        // ----------------------------------------------------
        // 사이트 루트 = manifest 스크립트 주소에서 "/assets/" 앞부분까지 (manifest.path 의 기준)
        const manifestScript = document.querySelector('script[src*="manifest.js"]');
        const siteRoot = (() => {
            if (!manifestScript) return new URL("./", window.location.href);
            const src = manifestScript.src;
            const i = src.lastIndexOf("/assets/");
            return i !== -1 ? new URL(src.slice(0, i + 1)) : new URL("./", window.location.href);
        })();
        const toUrl = (p) => new URL((p || "").replace(/^\/+/, "").replace(/\\/g, "/"), siteRoot);

        // 이 파일이 루트가 아닌 폴더에 있어도 "RPG 시스템"(루트 index.html)으로 돌아가도록
        document.getElementById("toc-back").href = new URL("index.html", siteRoot).href;

        // ----------------------------------------------------
        // 상태 메시지
        // ----------------------------------------------------
        function code(text) {
            const c = document.createElement("code");
            c.textContent = text;
            return c;
        }
        function showMessage(title, bodyNodes) {
            const box = document.createElement("div");
            box.className = "toc-message";
            const strong = document.createElement("strong");
            strong.textContent = title;
            box.appendChild(strong);
            bodyNodes.forEach((n) => box.appendChild(typeof n === "string" ? document.createTextNode(n) : n));
            colsEl.replaceWith(box);
        }

        const manifest = window.SITE_MANIFEST;
        if (!Array.isArray(manifest)) {
            showMessage("manifest.js 를 불러오지 못했습니다.",
                ["이 파일 하단의 ", code('<script src="../assets/js/manifest.js">'), " 경로를 확인하세요."]);
            return;
        }

        // ----------------------------------------------------
        // 어느 쪽 단에 넣을지: 항목의 column ("left" | "right") 이 있으면 그것을, 없으면 경로로 판단
        //  - 경로(또는 하위 문서 중 첫 경로)에 "/starter-rule/" 이 있으면 왼쪽(시작 규칙), 아니면 오른쪽(데이터)
        // ----------------------------------------------------
        const childrenOf = (item) => (item && Array.isArray(item.children) ? item.children : []);
        const firstPath = (item) => {
            if (item.path) return item.path;
            for (const kid of childrenOf(item)) {
                const p = firstPath(kid);
                if (p) return p;
            }
            return "";
        };
        const columnOf = (item) => {
            if (item.column === "left" || item.column === "right") return item.column;
            return /(^|\/)starter-rule\//.test(firstPath(item).replace(/\\/g, "/")) ? "left" : "right";
        };

        // ----------------------------------------------------
        // 묶음(아코디언): 하나를 펼치면 나머지(조상 제외)는 접힘
        // ----------------------------------------------------
        function setOpen(group, open) {
            group.classList.toggle("is-open", open);
            group.querySelector(":scope > .toc-group-btn").setAttribute("aria-expanded", String(open));
            if (!open) {   // 접을 때는 안쪽에 펼쳐 둔 묶음도 함께 접음
                group.querySelectorAll(".toc-group.is-open").forEach((g) => setOpen(g, false));
            }
        }
        function toggleGroup(group) {
            const willOpen = !group.classList.contains("is-open");
            if (willOpen) {
                document.querySelectorAll(".toc-group.is-open").forEach((other) => {
                    if (other !== group && !other.contains(group)) setOpen(other, false);
                });
            }
            setOpen(group, willOpen);
        }

        let groupSeq = 0;
        function renderItems(items, ul) {
            items.forEach((item) => {
                const kids = childrenOf(item);
                const li = document.createElement("li");

                if (kids.length) {
                    // 묶음: 누르면 펼쳐짐
                    li.className = "toc-group";
                    const panelId = "toc-panel-" + (++groupSeq);

                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.className = "toc-group-btn";
                    btn.setAttribute("aria-expanded", "false");
                    btn.setAttribute("aria-controls", panelId);
                    const label = document.createElement("span");
                    label.textContent = item.title || "";
                    const caret = document.createElement("span");
                    caret.className = "toc-caret";
                    caret.setAttribute("aria-hidden", "true");
                    btn.append(label, caret);
                    btn.addEventListener("click", () => toggleGroup(li));

                    const panel = document.createElement("div");
                    panel.className = "toc-panel";
                    panel.id = panelId;
                    const sub = document.createElement("ul");
                    sub.className = "toc-list";

                    // 묶음 자체에도 문서(path)가 있으면 맨 앞에 "개요"로 연결
                    const children = item.path ? [{ title: "개요", path: item.path }, ...kids] : kids;
                    renderItems(children, sub);
                    panel.appendChild(sub);

                    li.append(btn, panel);
                    if (item.open === true) setOpen(li, true);
                } else if (item.path) {
                    // 문서 한 장: 눌러서 바로 이동
                    const a = document.createElement("a");
                    a.className = "toc-link";
                    a.href = toUrl(item.path).href;
                    a.textContent = item.title || item.path;
                    li.appendChild(a);
                } else {
                    return;     // path 도 children 도 없는 항목은 건너뜀
                }
                ul.appendChild(li);
            });
        }

        const cols = { left: [], right: [] };
        manifest.forEach((item) => {
            if (!item.path && childrenOf(item).length === 0) return;
            cols[columnOf(item)].push(item);
        });

        if (cols.left.length + cols.right.length === 0) {
            showMessage("등록된 문서가 없습니다.",
                ["manifest.js 의 ", code("window.SITE_MANIFEST"), " 에 ", code('{ title: "제목", path: "폴더/파일.html" }'), " 를 추가하세요."]);
            return;
        }

        ["left", "right"].forEach((side) => {
            const section = document.getElementById("toc-" + side);
            if (cols[side].length === 0) { section.remove(); return; }
            renderItems(cols[side], document.getElementById("toc-" + side + "-list"));
        });
        // 한쪽 단이 비면 남은 쪽이 전체 폭을 사용
        if (cols.left.length === 0 || cols.right.length === 0) colsEl.classList.add("is-single");
    })();
</script>
</body>
</html>
